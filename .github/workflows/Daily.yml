name: Daily Deal Check

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run deal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python main.py
      - name: Commit updated dedup database and gallery
        run: |
          git config --global user.name "deal-bot"
          git config --global user.email "deal-bot@users.noreply.github.com"
          git add seen_deals.db docs/deals.json
          git diff --staged --quiet || git commit -m "Update seen deals and gallery [skip ci]"
          git fetch origin main
          git merge origin/main -X ours --no-edit -m "Merge remote (keep our regenerated data)"
          git push
